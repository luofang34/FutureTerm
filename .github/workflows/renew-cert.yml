name: Renew TLS Certificate

on:
  schedule:
    # Every 60 days — LE certs last 90 days, giving 30-day buffer
    - cron: '0 3 1 */2 *'
  workflow_dispatch:

# GitHub Secrets required:
#   CF_DNS_TOKEN - Zone DNS Edit for futureterm.app (used by acme.sh dns_cf plugin)

permissions:
  contents: write   # needed to create/update GitHub Release

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install acme.sh
        run: |
          curl -sSL https://get.acme.sh | sh -s email=cert@futureterm.app
          echo "$HOME/.acme.sh" >> "$GITHUB_PATH"

      - name: Issue or renew certificate
        env:
          CF_Token: ${{ secrets.CF_DNS_TOKEN }}
        run: |
          ~/.acme.sh/acme.sh --issue \
            --dns dns_cf \
            -d local.futureterm.app \
            --keylength 2048 \
            --server letsencrypt \
            --force

      - name: Build cert bundle JSON
        run: |
          CERT_DIR="$HOME/.acme.sh/local.futureterm.app"

          CERT_PEM=$(cat "$CERT_DIR/fullchain.cer")
          KEY_PEM=$(cat "$CERT_DIR/local.futureterm.app.key")
          EXPIRES=$(date -u -d "+90 days" +%Y-%m-%dT%H:%M:%SZ)

          jq -n \
            --arg cert "$CERT_PEM" \
            --arg key "$KEY_PEM" \
            --arg exp "$EXPIRES" \
            '{cert_pem: $cert, key_pem: $key, expires: $exp}' > cert-bundle.json

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create the release if it doesn't exist yet
          if ! gh release view cert-latest > /dev/null 2>&1; then
            gh release create cert-latest \
              --title "TLS Certificate" \
              --notes "Auto-renewed LE certificate for local.futureterm.app. Updated every 60 days." \
              cert-bundle.json
          else
            gh release upload cert-latest cert-bundle.json --clobber
          fi

      - name: Verify cert is downloadable
        run: |
          RESP=$(curl -sL https://github.com/luofang34/FutureTerm/releases/download/cert-latest/cert-bundle.json)
          if echo "$RESP" | jq -e '.cert_pem' > /dev/null 2>&1; then
            echo "Certificate uploaded and downloadable"
            echo "$RESP" | jq '{expires: .expires, cert_preview: (.cert_pem | split("\n") | .[0:2] | join("\n"))}'
          else
            echo "ERROR: Certificate not available after upload"
            echo "$RESP" | head -5
            exit 1
          fi
