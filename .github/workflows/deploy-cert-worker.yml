name: Deploy Cert Worker

on:
  push:
    branches: [main]
    paths:
      - 'cert-worker/**'
  workflow_dispatch:

# GitHub Secrets required (one-time setup):
#   CF_ACCOUNT_ID      - Cloudflare account ID
#   CF_WORKERS_TOKEN   - Custom token: Workers Scripts Edit + Workers KV Storage Edit
#   CF_DNS_TOKEN       - "Edit zone DNS" template token, scoped to futureterm.app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Deploy worker
        if: hashFiles('cert-worker/wrangler.toml') != ''
        run: |
          cd cert-worker
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Set worker runtime secrets
        run: |
          echo '{"CF_API_TOKEN":"${{ secrets.CF_DNS_TOKEN }}","FT_TOKEN":"ft-bridge-cert-v1"}' \
            | npx wrangler secret bulk --name futureterm-cert-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
