name: CI

on: [push, pull_request]

env:
  RUSTFLAGS: "--cfg=web_sys_unstable_apis"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Run comprehensive test suite
        run: ./dev.sh test

  build-web:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0

      - name: Build web release
        run: |
          cd apps/web
          RUSTFLAGS="--cfg=web_sys_unstable_apis" trunk build --release

  build-bridge:
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build bridge daemon
        run: cargo build --release -p bridge-daemon

      - name: Verify app bundle creation
        run: |
          mkdir -p FutureTerm.app/Contents/MacOS
          cp target/release/bridge-daemon FutureTerm.app/Contents/MacOS/bridge-daemon-bin
          cp apps/bridge-macos/Info.plist FutureTerm.app/Contents/
          chmod +x FutureTerm.app/Contents/MacOS/bridge-daemon-bin
          codesign --deep --force --sign "-" FutureTerm.app
