name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0

      - name: Download latest signed helper DMG
        run: |
          # Pull the latest signed+notarized DMG from GitHub Releases into the
          # bridge-helper directory so it gets deployed alongside the web app.
          # Falls back gracefully if no release exists yet.
          mkdir -p apps/web/bridge-helper
          gh release download \
            --repo "${{ github.repository }}" \
            --pattern "FutureTerm-Helper-arm64.dmg" \
            --dir apps/web/bridge-helper/ \
            --clobber 2>/dev/null && \
            mv apps/web/bridge-helper/FutureTerm-Helper-arm64.dmg \
               apps/web/bridge-helper/FutureTerm-Helper.dmg && \
            echo "Signed DMG downloaded" || \
            echo "No signed release found yet — bridge-helper will deploy without DMG"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build WASM app
        run: |
          cd apps/web
          RUSTFLAGS="--cfg=web_sys_unstable_apis" trunk build --release
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './apps/web/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
