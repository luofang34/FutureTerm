name: Renew Bridge TLS Certificate

on:
  schedule:
    # Run on the 1st and 15th of each month at 03:00 UTC.
    # Let's Encrypt certs last 90 days; renewing every 2 weeks
    # gives plenty of margin.
    - cron: '0 3 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install certbot + DNS plugin
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq certbot python3-certbot-dns-route53 python3-certbot-dns-cloudflare

      - name: Renew certificate (Route 53 — futureterm.com)
        if: env.AWS_ACCESS_KEY_ID != ''
        run: |
          certbot certonly \
            --dns-route53 \
            -d local.futureterm.com \
            --non-interactive --agree-tos \
            -m "${{ secrets.CERT_EMAIL }}" \
            --preferred-challenges dns-01 \
            --config-dir ./certbot-config \
            --work-dir ./certbot-work \
            --logs-dir ./certbot-logs
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Renew certificate (Cloudflare — futureterm.app)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          echo "dns_cloudflare_api_token = ${CLOUDFLARE_API_TOKEN}" > /tmp/cloudflare.ini
          chmod 600 /tmp/cloudflare.ini
          certbot certonly \
            --dns-cloudflare \
            --dns-cloudflare-credentials /tmp/cloudflare.ini \
            -d local.futureterm.app \
            --non-interactive --agree-tos \
            -m "${{ secrets.CERT_EMAIL }}" \
            --preferred-challenges dns-01 \
            --config-dir ./certbot-config \
            --work-dir ./certbot-work \
            --logs-dir ./certbot-logs
          rm -f /tmp/cloudflare.ini
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Package cert bundle as JSON
        run: |
          mkdir -p apps/web/cert

          # Find the cert directory (certbot names it after the domain)
          CERT_DIR=""
          for d in local.futureterm.com local.futureterm.app; do
            if [ -d "./certbot-config/live/${d}" ]; then
              CERT_DIR="./certbot-config/live/${d}"
              break
            fi
          done

          if [ -z "$CERT_DIR" ]; then
            echo "ERROR: No certificate directory found"
            ls -la ./certbot-config/live/ 2>/dev/null || echo "No live directory"
            exit 1
          fi

          CERT=$(cat "${CERT_DIR}/fullchain.pem")
          KEY=$(cat "${CERT_DIR}/privkey.pem")
          NOT_AFTER=$(openssl x509 -enddate -noout -in "${CERT_DIR}/cert.pem" | cut -d= -f2)

          # Create JSON bundle
          jq -n \
            --arg cert "$CERT" \
            --arg key "$KEY" \
            --arg not_after "$NOT_AFTER" \
            '{ version: 1, cert_pem: $cert, key_pem: $key, not_after: $not_after }' \
            > apps/web/cert/bridge.json

          echo "Certificate bundle created. Expires: ${NOT_AFTER}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/web/cert/bridge.json
          if git diff --cached --quiet; then
            echo "No changes to commit (cert unchanged)"
          else
            git commit -m "chore: renew bridge TLS certificate

          Automated Let's Encrypt certificate renewal for local.futureterm.com.
          The daemon fetches this cert on startup to serve wss://."
            git push
          fi
