[package]
name = "bridge-daemon"
version = "0.3.1"
edition = "2021"
rust-version = "1.93.0"

[[bin]]
name = "bridge-daemon"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.41", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync", "fs"] }
tokio-serial = "5.4"
tokio-tungstenite = "0.26"
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
ureq = "3"
dirs = "6"
