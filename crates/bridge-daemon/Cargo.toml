[package]
name = "bridge-daemon"
version = "0.1.0"
edition = "2021"
rust-version = "1.93.0"

[[bin]]
name = "bridge-daemon"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.41", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
tokio-serial = "5.4"
tokio-tungstenite = "0.26"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
